[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-image-attacks"
version = "0.2.0"
description = "Create bounded, guide-image perturbations for adversarial-image experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.1",
]

[project.optional-dependencies]
vision = [
    "openai>=3.2,<4",
]
ui = [
    "gradio>=6.24,<7",
    "openai>=3.2,<4",
]
test = [
    "pytest>=7",
]
attack = [
    "scikit-image>=0.19",
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
]

[project.scripts]
advmerge = "adversarial_image_attacks.cli:main"
advmerge-ui = "adversarial_image_attacks.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
